<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatMD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        .typing-dots {
            display: inline-block;
        }
        .typing-dots::after {
            content: '...';
            animation: typing 1.5s infinite;
        }
        @keyframes typing {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden">
    <div class="container mx-auto p-4 h-full grid grid-rows-[auto_1fr] gap-4">
        <h1 class="text-3xl font-bold">ChatMD</h1>
        
        <!-- Main content area with chat and visualization panels -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 min-h-0">
            <!-- Left column: Chat and Status -->
            <div class="flex flex-col gap-4 min-h-0">
                <!-- Chat panel -->
                <div class="bg-gray-800 p-4 rounded-lg shadow-lg grid grid-rows-[auto_1fr_auto] gap-2 flex-1 min-h-0">
                    <h2 class="text-xl font-semibold">Chat</h2>
                    <div id="chat-container" class="overflow-y-auto bg-gray-700 p-2 rounded min-h-0">
                        <!-- Chat messages will appear here -->
                    </div>
                    <div class="flex">
                        <input type="text" id="user-input" class="flex-grow bg-gray-600 text-white rounded-l-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your command...">
                        <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r-lg">Send</button>
                    </div>
                </div>
                
                <!-- Status panel (only under chat) -->
                <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-xl font-semibold">Simulation Status</h2>
                        <div id="connection-indicator" class="flex items-center text-sm">
                            <div id="connection-dot" class="w-2 h-2 rounded-full bg-gray-500 mr-2"></div>
                            <span id="connection-text">Connecting...</span>
                        </div>
                    </div>
                    <div id="status-container" class="text-gray-300">
                        Ready to run simulations
                    </div>
                </div>
            </div>
            
            <!-- Right column: Thermodynamic plots -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-lg grid grid-rows-[auto_1fr] gap-2 min-h-0">
                <h2 class="text-xl font-semibold">Thermodynamic Data</h2>
                <div id="plot-container" class="bg-gray-700 p-2 rounded overflow-y-auto min-h-0">
                    <div id="plot-placeholder" class="text-gray-400 flex items-center justify-center h-full">
                        Run a simulation to see thermodynamic data
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let thermoCharts = [];
        let socket = null;
        let streamingData = [];
        let streamingGroups = [];
        let isStreamingSimulation = false;
        
        // Initialize Socket.IO connection
        function initializeSocket() {
            socket = io();
            
            socket.on('connect', function() {
                console.log('✅ WebSocket: Connected to server via WebSocket');
                updateStatus('🔗 WebSocket connected');
                updateConnectionStatus('connected');
            });
            
            socket.on('disconnect', function() {
                console.log('❌ WebSocket: Disconnected from server');
                updateStatus('🔌 WebSocket disconnected');
                updateConnectionStatus('disconnected');
            });
            
            socket.on('simulation_started', function(data) {
                console.log('🚀 WebSocket: Streaming simulation started:', data);
                updateStatus('🚀 Streaming simulation started...');
                isStreamingSimulation = true;
                streamingData = [];
                initializeStreamingPlots();
            });
            
            socket.on('thermo_data_point', function(dataPoint) {
                console.log('📊 WebSocket: New thermo data point received:', dataPoint);
                console.log(`📈 Data flow: Point ${streamingData.length + 1}, Step: ${dataPoint.step || 'unknown'}`);
                streamingData.push(dataPoint);
                updateStreamingPlots(dataPoint);
            });
            
            socket.on('simulation_complete', function(data) {
                console.log('✅ WebSocket: Streaming simulation completed:', data);
                console.log(`📊 Final stats: ${data.total_points} total data points received`);
                updateStatus(`✅ Streaming simulation completed! Total points: ${data.total_points}`);
                isStreamingSimulation = false;
                
                // Add completion message to chat
                addConversationMessage('System', data.message, 'success');
            });
            
            socket.on('simulation_error', function(data) {
                console.error('❌ WebSocket: Streaming simulation error:', data);
                updateStatus('❌ Streaming simulation failed');
                isStreamingSimulation = false;
                
                // Add error message to chat
                addConversationMessage('System', data.message, 'error');
            });
            
            socket.on('error', function(data) {
                console.error('Socket error:', data);
                addConversationMessage('System', data.message, 'error');
            });
        }
        
        // Initialize streaming plots with empty data
        function initializeStreamingPlots() {
            // Clear existing plots
            clearPlots();
            
            // Hide placeholder if it exists
            const placeholder = document.getElementById('plot-placeholder');
            if (placeholder) {
                placeholder.style.display = 'none';
            }
            
            // Initialize with empty groups - will be populated when first data arrives
            streamingGroups = [];
            
            updateStatus('Live plots initialized - waiting for data...');
        }
        
        // Create an empty streaming chart
        function createStreamingChart(group, index) {
            const canvas = createPlotCanvas(group, index);
            const ctx = canvas.getContext('2d');
            
            // Create datasets for this group
            const datasets = [];
            const scales = {
                x: {
                    display: true,
                    title: {
                        display: true,
                        text: 'Time Step',
                        color: 'white'
                    },
                    ticks: {
                        color: 'white'
                    },
                    grid: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    }
                }
            };
            
            group.properties.forEach((property, propIndex) => {
                const color = group.colors[propIndex] || 'rgb(255, 255, 255)';
                const yAxisID = propIndex === 0 ? 'y' : 'y1';
                
                datasets.push({
                    label: property.charAt(0).toUpperCase() + property.slice(1),
                    data: [],
                    borderColor: color,
                    backgroundColor: color.replace('rgb', 'rgba').replace(')', ', 0.1)'),
                    yAxisID: yAxisID,
                    tension: 0.1
                });
                
                // Create y-axis configuration
                scales[yAxisID] = {
                    type: 'linear',
                    display: true,
                    position: propIndex === 0 ? 'left' : 'right',
                    title: {
                        display: true,
                        text: `${property.charAt(0).toUpperCase() + property.slice(1)} ${group.units[propIndex] ? `(${group.units[propIndex]})` : ''}`,
                        color: color
                    },
                    ticks: {
                        color: color
                    },
                    grid: {
                        drawOnChartArea: propIndex === 0,
                        color: color.replace('rgb', 'rgba').replace(')', ', 0.1)')
                    }
                };
            });
            
            // Create the chart
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 0 // Disable animations for real-time updates
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: group.name,
                            color: 'white'
                        },
                        legend: {
                            labels: {
                                color: 'white'
                            }
                        }
                    },
                    scales: scales
                }
            });
            
            thermoCharts.push(chart);
        }
        
        // Update streaming plots with new data point
        function updateStreamingPlots(dataPoint) {
            if (!isStreamingSimulation) return;
            
            // If this is the first data point, initialize the groups using the same logic as batch mode
            if (streamingData.length === 1 && streamingGroups.length === 0) {
                // Use the same grouping logic as batch mode
                const availableProps = identifyAvailableProperties([dataPoint]);
                streamingGroups = groupAvailableProperties(availableProps);
                
                // Create charts for each group
                streamingGroups.forEach((group, index) => {
                    createStreamingChart(group, index);
                });
                
                console.log('Streaming plots initialized with groups:', streamingGroups);
            }
            
            if (thermoCharts.length === 0) return;
            
            const step = dataPoint.step || streamingData.length;
            
            streamingGroups.forEach((group, groupIndex) => {
                const chart = thermoCharts[groupIndex];
                if (!chart) return;
                
                // Add new step to labels
                chart.data.labels.push(step);
                
                // Update each dataset in this group
                group.properties.forEach((property, propIndex) => {
                    const dataset = chart.data.datasets[propIndex];
                    if (dataset) {
                        // Use the same property extraction logic as batch mode
                        const data = extractPropertyData([dataPoint], property);
                        const value = data[0] || 0;
                        dataset.data.push(value);
                    }
                });
                
                // Limit data points to prevent memory issues (keep last 1000 points)
                const maxPoints = 1000;
                if (chart.data.labels.length > maxPoints) {
                    chart.data.labels.shift();
                    chart.data.datasets.forEach(dataset => {
                        dataset.data.shift();
                    });
                }
                
                // Update the chart
                chart.update('none'); // 'none' mode for fastest updates
            });
            
            // Update status with current data point count
            updateStatus(`Live simulation: ${streamingData.length} data points received`);
        }
        
        // Define thermodynamic property groups
        const propertyGroups = {
            energy: {
                name: 'Energy Properties',
                properties: ['TotEng', 'PotEng', 'KinEng', 'E_bond', 'E_angle', 'E_dihed', 'E_impro', 'E_vdwl', 'E_coul', 'E_long'],
                units: 'Energy Units',
                colors: ['rgb(54, 162, 235)', 'rgb(75, 192, 192)', 'rgb(153, 102, 255)']
            },
            thermal: {
                name: 'Temperature & Pressure',
                properties: ['Temp', 'Press'],
                units: ['K', 'atm'],
                colors: ['rgb(255, 99, 132)', 'rgb(255, 205, 86)']
            },
            volume: {
                name: 'Volume & Density',
                properties: ['Volume', 'Density'],
                units: ['Volume Units', 'Density Units'],
                colors: ['rgb(255, 159, 64)', 'rgb(199, 199, 199)']
            },
            stress: {
                name: 'Stress Components',
                properties: ['Pxx', 'Pyy', 'Pzz', 'Pxy', 'Pxz', 'Pyz'],
                units: 'Pressure Units',
                colors: ['rgb(83, 102, 255)', 'rgb(255, 83, 102)', 'rgb(102, 255, 83)', 'rgb(255, 102, 255)', 'rgb(102, 255, 255)', 'rgb(255, 255, 102)']
            }
        };

        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function addMessage(sender, message) {
            const chatContainer = document.getElementById('chat-container');
            const messageElement = document.createElement('div');
            messageElement.classList.add('mb-3', 'p-2', 'rounded');
            
            // Check if this is a user message
            if (sender === 'You') {
                messageElement.classList.add('bg-purple-800', 'border-l-4', 'border-purple-400');
                messageElement.innerHTML = `
                    <div class="flex items-start">
                        <span class="mr-2 text-lg">👤</span>
                        <div class="flex-1">
                            <strong class="text-white">${sender}:</strong>
                            <div class="mt-1 text-gray-100">${message.replace(/\n/g, '<br>')}</div>
                        </div>
                    </div>
                `;
            } else {
                // Keep original styling for non-user messages
                messageElement.classList.add('mb-2');
                messageElement.innerHTML = `<p><strong>${sender}:</strong> ${message}</p>`;
            }
            
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addConversationMessage(agent, content, type) {
            const chatContainer = document.getElementById('chat-container');
            const messageElement = document.createElement('div');
            messageElement.classList.add('mb-3', 'p-2', 'rounded');
            
            // Color coding for different agents
            let colorClass = '';
            let agentIcon = '';
            
            switch(agent) {
                case 'Orchestrator':
                    colorClass = 'bg-blue-800 border-l-4 border-blue-400';
                    agentIcon = '🎯';
                    break;
                case 'Generator':
                    colorClass = 'bg-green-800 border-l-4 border-green-400';
                    agentIcon = '⚙️';
                    break;
                case 'Reviewer':
                    colorClass = 'bg-yellow-800 border-l-4 border-yellow-400';
                    agentIcon = '🔍';
                    break;
                case 'System':
                    if (type === 'error') {
                        colorClass = 'bg-red-800 border-l-4 border-red-400';
                        agentIcon = '❌';
                    } else if (type === 'success') {
                        colorClass = 'bg-green-800 border-l-4 border-green-400';
                        agentIcon = '✅';
                    } else {
                        colorClass = 'bg-gray-700 border-l-4 border-gray-400';
                        agentIcon = 'ℹ️';
                    }
                    break;
                default:
                    colorClass = 'bg-gray-700';
                    agentIcon = '💬';
            }
            
            messageElement.classList.add(...colorClass.split(' '));
            
            // Format content based on type
            let formattedContent = content;
            if (type === 'script') {
                formattedContent = `<pre class="bg-gray-900 p-2 rounded mt-2 overflow-x-auto"><code>${content}</code></pre>`;
            } else {
                formattedContent = content.replace(/\n/g, '<br>');
            }
            
            messageElement.innerHTML = `
                <div class="flex items-start">
                    <span class="mr-2 text-lg">${agentIcon}</span>
                    <div class="flex-1">
                        <strong class="text-white">${agent}:</strong>
                        <div class="mt-1 text-gray-100">${formattedContent}</div>
                    </div>
                </div>
            `;
            
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateStatus(message) {
            const statusContainer = document.getElementById('status-container');
            statusContainer.textContent = message;
        }

        function updateConnectionStatus(status) {
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');
            
            switch(status) {
                case 'connected':
                    dot.className = 'w-2 h-2 rounded-full bg-green-500 mr-2';
                    text.textContent = 'Connected';
                    break;
                case 'disconnected':
                    dot.className = 'w-2 h-2 rounded-full bg-red-500 mr-2';
                    text.textContent = 'Disconnected';
                    break;
                case 'connecting':
                default:
                    dot.className = 'w-2 h-2 rounded-full bg-yellow-500 mr-2';
                    text.textContent = 'Connecting...';
                    break;
            }
        }

        function clearPlots() {
            // Destroy existing charts
            thermoCharts.forEach(chart => {
                if (chart) {
                    chart.destroy();
                }
            });
            thermoCharts = [];
            
            // Clear plot container
            const plotContainer = document.getElementById('plot-container');
            plotContainer.innerHTML = '';
        }

        function identifyAvailableProperties(thermoData) {
            if (!thermoData || thermoData.length === 0) return [];
            
            const sampleData = thermoData[0];
            const availableProps = [];
            
            // Map common property names to standardized names
            const propertyMap = {
                'temp': 'Temp',
                'temperature': 'Temp',
                'press': 'Press',
                'pressure': 'Press',
                'etotal': 'TotEng',
                'toteng': 'TotEng',
                'total_energy': 'TotEng',
                'poteng': 'PotEng',
                'potential_energy': 'PotEng',
                'kineng': 'KinEng',
                'kinetic_energy': 'KinEng',
                'volume': 'Volume',
                'density': 'Density',
                'pxx': 'Pxx',
                'pyy': 'Pyy',
                'pzz': 'Pzz',
                'pxy': 'Pxy',
                'pxz': 'Pxz',
                'pyz': 'Pyz'
            };
            
            // Check which properties are available in the data
            for (const [key, standardName] of Object.entries(propertyMap)) {
                if (key in sampleData && sampleData[key] !== undefined && sampleData[key] !== null) {
                    if (!availableProps.includes(standardName)) {
                        availableProps.push(standardName);
                    }
                }
            }
            
            return availableProps;
        }

        function groupAvailableProperties(availableProps) {
            const groups = [];
            
            // Check each property group and see what's available
            for (const [groupKey, groupConfig] of Object.entries(propertyGroups)) {
                const availableInGroup = availableProps.filter(prop => 
                    groupConfig.properties.includes(prop)
                );
                
                if (availableInGroup.length > 0) {
                    // Split into chunks of max 2 properties per plot
                    for (let i = 0; i < availableInGroup.length; i += 2) {
                        const chunk = availableInGroup.slice(i, i + 2);
                        groups.push({
                            name: availableInGroup.length > 2 ? 
                                `${groupConfig.name} (${Math.floor(i/2) + 1})` : 
                                groupConfig.name,
                            properties: chunk,
                            colors: groupConfig.colors.slice(i, i + 2),
                            units: Array.isArray(groupConfig.units) ? 
                                groupConfig.units.slice(i, i + 2) : 
                                [groupConfig.units, groupConfig.units]
                        });
                    }
                }
            }
            
            return groups;
        }

        function extractPropertyData(thermoData, propertyName) {
            const propertyMap = {
                'Temp': ['temp', 'temperature'],
                'Press': ['press', 'pressure'],
                'TotEng': ['etotal', 'toteng', 'total_energy'],
                'PotEng': ['poteng', 'potential_energy'],
                'KinEng': ['kineng', 'kinetic_energy'],
                'Volume': ['volume'],
                'Density': ['density'],
                'Pxx': ['pxx'],
                'Pyy': ['pyy'],
                'Pzz': ['pzz'],
                'Pxy': ['pxy'],
                'Pxz': ['pxz'],
                'Pyz': ['pyz']
            };
            
            const possibleKeys = propertyMap[propertyName] || [propertyName.toLowerCase()];
            
            return thermoData.map(dataPoint => {
                for (const key of possibleKeys) {
                    if (key in dataPoint && dataPoint[key] !== undefined && dataPoint[key] !== null) {
                        return dataPoint[key];
                    }
                }
                return 0;
            });
        }

        function createPlotCanvas(group, index) {
            const plotContainer = document.getElementById('plot-container');
            
            // Create plot wrapper
            const plotWrapper = document.createElement('div');
            plotWrapper.className = 'mb-4 bg-gray-800 p-3 rounded';
            plotWrapper.style.height = '300px';
            
            // Create canvas
            const canvas = document.createElement('canvas');
            canvas.id = `chart-${index}`;
            canvas.style.height = '100%';
            canvas.style.width = '100%';
            
            plotWrapper.appendChild(canvas);
            plotContainer.appendChild(plotWrapper);
            
            return canvas;
        }

        function drawGroupedPlot(thermoData, group, index) {
            const canvas = createPlotCanvas(group, index);
            const ctx = canvas.getContext('2d');
            
            // Extract time steps
            const steps = thermoData.map(dataPoint => dataPoint.step || 0);
            
            // Create datasets for this group
            const datasets = [];
            const scales = {
                x: {
                    display: true,
                    title: {
                        display: true,
                        text: 'Time Step',
                        color: 'white'
                    },
                    ticks: {
                        color: 'white'
                    },
                    grid: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    }
                }
            };
            
            group.properties.forEach((property, propIndex) => {
                const data = extractPropertyData(thermoData, property);
                const color = group.colors[propIndex] || 'rgb(255, 255, 255)';
                const yAxisID = propIndex === 0 ? 'y' : 'y1';
                
                datasets.push({
                    label: property,
                    data: data,
                    borderColor: color,
                    backgroundColor: color.replace('rgb', 'rgba').replace(')', ', 0.1)'),
                    yAxisID: yAxisID,
                    tension: 0.1
                });
                
                // Create y-axis configuration
                scales[yAxisID] = {
                    type: 'linear',
                    display: true,
                    position: propIndex === 0 ? 'left' : 'right',
                    title: {
                        display: true,
                        text: `${property} ${group.units[propIndex] ? `(${group.units[propIndex]})` : ''}`,
                        color: color
                    },
                    ticks: {
                        color: color
                    },
                    grid: {
                        drawOnChartArea: propIndex === 0,
                        color: color.replace('rgb', 'rgba').replace(')', ', 0.1)')
                    }
                };
            });
            
            // Create the chart
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: steps,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: group.name,
                            color: 'white'
                        },
                        legend: {
                            labels: {
                                color: 'white'
                            }
                        }
                    },
                    scales: scales
                }
            });
            
            thermoCharts.push(chart);
        }

        function drawPlot(thermoData) {
            if (!thermoData || thermoData.length === 0) {
                console.log('No thermodynamic data to plot');
                return;
            }

            console.log(`Received ${thermoData.length} data points:`, thermoData);

            // Hide placeholder
            const placeholder = document.getElementById('plot-placeholder');
            placeholder.style.display = 'none';

            // Clear existing plots
            clearPlots();

            // Identify available properties in the data
            const availableProps = identifyAvailableProperties(thermoData);
            console.log('Available properties:', availableProps);

            if (availableProps.length === 0) {
                console.log('No recognized thermodynamic properties found');
                const plotContainer = document.getElementById('plot-container');
                plotContainer.innerHTML = '<div class="text-gray-400 flex items-center justify-center h-full">No recognized thermodynamic properties found in data</div>';
                return;
            }

            // Group properties for plotting
            const groups = groupAvailableProperties(availableProps);
            console.log('Property groups:', groups);

            // Create plots for each group
            groups.forEach((group, index) => {
                drawGroupedPlot(thermoData, group, index);
            });

            updateStatus(`Created ${groups.length} plots with ${availableProps.length} properties`);
        }

        let currentAgentMessages = {};
        let isStreaming = false;
        let conversationContext = '';  // Store context for phase 2 conversations
        let executionIntent = false;  // Track if original request implied execution
        let messageCounter = 0;  // Counter to ensure unique message IDs

        function addTypingIndicator(agent) {
            const chatContainer = document.getElementById('chat-container');
            const typingElement = document.createElement('div');
            typingElement.classList.add('mb-3', 'p-2', 'rounded');
            typingElement.id = `typing-${agent}`;
            
            let colorClass = '';
            let agentIcon = '';
            
            switch(agent) {
                case 'Orchestrator':
                    colorClass = 'bg-blue-800 border-l-4 border-blue-400';
                    agentIcon = '🎯';
                    break;
                case 'Generator':
                    colorClass = 'bg-green-800 border-l-4 border-green-400';
                    agentIcon = '⚙️';
                    break;
                case 'Reviewer':
                    colorClass = 'bg-yellow-800 border-l-4 border-yellow-400';
                    agentIcon = '🔍';
                    break;
                case 'System':
                    colorClass = 'bg-gray-700 border-l-4 border-gray-400';
                    agentIcon = 'ℹ️';
                    break;
            }
            
            typingElement.classList.add(...colorClass.split(' '));
            typingElement.innerHTML = `
                <div class="flex items-start">
                    <span class="mr-2 text-lg">${agentIcon}</span>
                    <div class="flex-1">
                        <strong class="text-white">${agent}:</strong>
                        <div class="mt-1 text-gray-100">
                            <span class="typing-dots">Thinking...</span>
                        </div>
                    </div>
                </div>
            `;
            
            chatContainer.appendChild(typingElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator(agent) {
            const typingElement = document.getElementById(`typing-${agent}`);
            if (typingElement) {
                typingElement.remove();
            }
        }

        function addStreamingMessage(agent, content, messageType) {
            // Ensure content is defined and not null
            if (content === undefined || content === null) {
                content = '';
            }
            
            // Use agent name as key for current streaming session
            const sessionKey = `${agent}-${messageType || 'default'}`;
            
            // Check if we already have a message for this agent in this session
            let messageElement = document.getElementById(`current-${sessionKey}`);
            let messageId = `current-${sessionKey}`;
            
            if (!messageElement) {
                // Create new message element
                messageCounter++;
                
                const chatContainer = document.getElementById('chat-container');
                messageElement = document.createElement('div');
                messageElement.classList.add('mb-3', 'p-2', 'rounded');
                messageElement.id = messageId;
                
                let colorClass = '';
                let agentIcon = '';
                
                switch(agent) {
                    case 'Orchestrator':
                        colorClass = 'bg-blue-800 border-l-4 border-blue-400';
                        agentIcon = '🎯';
                        break;
                    case 'Generator':
                        colorClass = 'bg-green-800 border-l-4 border-green-400';
                        agentIcon = '⚙️';
                        break;
                    case 'Reviewer':
                        colorClass = 'bg-yellow-800 border-l-4 border-yellow-400';
                        agentIcon = '🔍';
                        break;
                    case 'System':
                        if (messageType === 'error') {
                            colorClass = 'bg-red-800 border-l-4 border-red-400';
                            agentIcon = '❌';
                        } else if (messageType === 'success') {
                            colorClass = 'bg-green-800 border-l-4 border-green-400';
                            agentIcon = '✅';
                        } else {
                            colorClass = 'bg-gray-700 border-l-4 border-gray-400';
                            agentIcon = 'ℹ️';
                        }
                        break;
                    default:
                        colorClass = 'bg-gray-700';
                        agentIcon = '💬';
                }
                
                messageElement.classList.add(...colorClass.split(' '));
                messageElement.innerHTML = `
                    <div class="flex items-start">
                        <span class="mr-2 text-lg">${agentIcon}</span>
                        <div class="flex-1">
                            <strong class="text-white">${agent}:</strong>
                            <div class="mt-1 text-gray-100" id="content-${messageId}"></div>
                        </div>
                    </div>
                `;
                
                chatContainer.appendChild(messageElement);
                
                // Initialize the content accumulator
                if (!currentAgentMessages[sessionKey]) {
                    currentAgentMessages[sessionKey] = '';
                }
            }
            
            // Append content to existing message
            currentAgentMessages[sessionKey] += content;
            const contentElement = document.getElementById(`content-${messageId}`);
            
            if (contentElement) {
                // Format content based on type
                let formattedContent = currentAgentMessages[sessionKey] || '';
                if (messageType === 'script') {
                    formattedContent = `<pre class="bg-gray-900 p-2 rounded mt-2 overflow-x-auto"><code>${formattedContent}</code></pre>`;
                } else {
                    formattedContent = formattedContent.replace(/\n/g, '<br>');
                }
                
                contentElement.innerHTML = formattedContent;
            }
            
            // Auto-scroll
            const chatContainer = document.getElementById('chat-container');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Initialize the application when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeSocket();
            updateStatus('Initializing connection...');
        });

        async function sendMessage() {
            const userInput = document.getElementById('user-input');
            const message = userInput.value.trim();

            if (message === '' || isStreaming) return;

            addMessage('You', message);
            userInput.value = '';
            updateStatus('Processing request...');
            isStreaming = true;
            currentAgentMessages = {};

            try {
                // Detect execution intent from the original request if this is a new conversation
                if (!conversationContext) {
                    const messageLower = message.toLowerCase();
                    executionIntent = ['simulate', 'run', 'execute', 'perform', 'start simulation', 'do simulation'].some(keyword => 
                        messageLower.includes(keyword)
                    );
                }
                
                // Build URL parameters
                const params = new URLSearchParams({
                    command: message
                });
                
                // Add conversation context if we're in phase 2
                if (conversationContext) {
                    params.append('context', conversationContext);
                    // Pass execution intent to backend
                    params.append('execution_intent', executionIntent.toString());
                    // Clear context after use
                    conversationContext = '';
                }
                
                // Use EventSource for streaming with live WebSocket support
                const eventSource = new EventSource('/api/llm-stream-live?' + params);

                eventSource.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        
                        switch(data.type) {
                            case 'status':
                                updateStatus(data.message);
                                break;
                                
                            case 'agent_start':
                                removeTypingIndicator(data.agent);
                                addTypingIndicator(data.agent);
                                break;
                                
                            case 'agent_content':
                                removeTypingIndicator(data.agent);
                                addStreamingMessage(data.agent, data.content, data.message_type);
                                break;
                                
                            case 'agent_complete':
                                removeTypingIndicator(data.agent);
                                break;
                                
                            case 'start_streaming_simulation':
                                console.log('🎬 SSE: Received start_streaming_simulation event');
                                console.log('🔌 WebSocket status:', socket ? 'initialized' : 'not initialized');
                                console.log('🔗 WebSocket connected:', socket && socket.connected);
                                
                                // Start streaming simulation via WebSocket
                                if (socket && socket.connected) {
                                    console.log('📡 Emitting start_streaming_simulation to WebSocket server...');
                                    socket.emit('start_streaming_simulation', { script: data.script });
                                } else {
                                    console.warn('⚠️ WebSocket not available, falling back to batch simulation');
                                    // Fallback to regular simulation
                                    addConversationMessage('System', 'WebSocket not connected, falling back to batch simulation', 'info');
                                }
                                break;
                                
                            case 'simulation_complete':
                                updateStatus('Simulation completed successfully');
                                if (data.thermo_data && Array.isArray(data.thermo_data)) {
                                    drawPlot(data.thermo_data);
                                }
                                break;
                                
                            case 'simulation_failed':
                                updateStatus('Simulation failed');
                                break;
                                
                            case 'script_ready':
                                updateStatus('Script ready - add "run" to execute');
                                break;
                                
                            case 'needs_more_info':
                                updateStatus('Waiting for additional information');
                                isStreaming = false;
                                eventSource.close();
                                break;
                                
                            case 'awaiting_confirmation':
                                updateStatus('Awaiting parameter confirmation');
                                // Store the analysis for phase 2
                                conversationContext = data.analysis;
                                isStreaming = false;
                                eventSource.close();
                                break;
                                
                            case 'review_failed':
                                updateStatus('Script review failed');
                                break;
                                
                            case 'workflow_complete':
                                updateStatus('Ready to run simulations');
                                isStreaming = false;
                                eventSource.close();
                                break;
                                
                            case 'error':
                                addMessage('Error', data.message);
                                updateStatus('Error occurred');
                                isStreaming = false;
                                eventSource.close();
                                break;
                        }
                    } catch (e) {
                        console.error('Error parsing SSE data:', e);
                    }
                };

                eventSource.onerror = function(event) {
                    console.error('EventSource failed:', event);
                    addMessage('Error', 'Connection to server lost. Please try again.');
                    updateStatus('Error occurred');
                    isStreaming = false;
                    eventSource.close();
                };

            } catch (error) {
                console.error('Error sending message:', error);
                addMessage('Error', 'Could not connect to the server.');
                updateStatus('Error occurred');
                isStreaming = false;
            }
        }
    </script>
</body>
</html>

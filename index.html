<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Molecular Dynamics Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-4">LLM Molecular Dynamics Studio</h1>
        
        <!-- Main content area with chat and visualization panels -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            <!-- Chat panel -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
                <h2 class="text-xl font-semibold mb-2">Chat</h2>
                <div id="chat-container" class="h-80 overflow-y-auto mb-4 bg-gray-700 p-2 rounded">
                    <!-- Chat messages will appear here -->
                </div>
                <div class="flex">
                    <input type="text" id="user-input" class="flex-grow bg-gray-600 text-white rounded-l-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your command...">
                    <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r-lg">Send</button>
                </div>
            </div>
            
            <!-- Thermodynamic plot panel -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
                <h2 class="text-xl font-semibold mb-2">Thermodynamic Data</h2>
                <div id="plot-container" class="h-80 bg-gray-700 p-2 rounded flex items-center justify-center">
                    <canvas id="thermo-chart" class="hidden"></canvas>
                    <div id="plot-placeholder" class="text-gray-400">
                        Run a simulation to see thermodynamic data
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Status and information panel -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-2">Simulation Status</h2>
            <div id="status-container" class="text-gray-300">
                Ready to run simulations
            </div>
        </div>
    </div>

    <script>
        let thermoChart = null;

        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function addMessage(sender, message) {
            const chatContainer = document.getElementById('chat-container');
            const messageElement = document.createElement('div');
            messageElement.classList.add('mb-2');
            messageElement.innerHTML = `<p><strong>${sender}:</strong> ${message}</p>`;
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateStatus(message) {
            const statusContainer = document.getElementById('status-container');
            statusContainer.textContent = message;
        }

        function drawPlot(thermoData) {
            if (!thermoData || thermoData.length === 0) {
                console.log('No thermodynamic data to plot');
                return;
            }

            // Show the chart canvas and hide placeholder
            const chartCanvas = document.getElementById('thermo-chart');
            const placeholder = document.getElementById('plot-placeholder');
            chartCanvas.classList.remove('hidden');
            placeholder.style.display = 'none';

            // Destroy existing chart if it exists
            if (thermoChart) {
                thermoChart.destroy();
            }

            // Prepare data for plotting
            const steps = thermoData.map(d => d.step || 0);
            const temperatures = thermoData.map(d => d.temp || 0);
            const energies = thermoData.map(d => d.etotal || 0);
            const pressures = thermoData.map(d => d.press || 0);

            // Create the chart
            const ctx = chartCanvas.getContext('2d');
            thermoChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: steps,
                    datasets: [
                        {
                            label: 'Temperature',
                            data: temperatures,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            yAxisID: 'y'
                        },
                        {
                            label: 'Total Energy',
                            data: energies,
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            yAxisID: 'y1'
                        },
                        {
                            label: 'Pressure',
                            data: pressures,
                            borderColor: 'rgb(255, 205, 86)',
                            backgroundColor: 'rgba(255, 205, 86, 0.1)',
                            yAxisID: 'y2'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Thermodynamic Properties vs Time Step',
                            color: 'white'
                        },
                        legend: {
                            labels: {
                                color: 'white'
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            title: {
                                display: true,
                                text: 'Time Step',
                                color: 'white'
                            },
                            ticks: {
                                color: 'white'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Temperature',
                                color: 'rgb(255, 99, 132)'
                            },
                            ticks: {
                                color: 'rgb(255, 99, 132)'
                            },
                            grid: {
                                color: 'rgba(255, 99, 132, 0.1)'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Total Energy',
                                color: 'rgb(54, 162, 235)'
                            },
                            ticks: {
                                color: 'rgb(54, 162, 235)'
                            },
                            grid: {
                                drawOnChartArea: false,
                                color: 'rgba(54, 162, 235, 0.1)'
                            }
                        },
                        y2: {
                            type: 'linear',
                            display: false,
                            position: 'right'
                        }
                    }
                }
            });

            updateStatus(`Plotted ${thermoData.length} data points`);
        }

        async function sendMessage() {
            const userInput = document.getElementById('user-input');
            const message = userInput.value.trim();

            if (message === '') return;

            addMessage('You', message);
            userInput.value = '';
            updateStatus('Processing request...');

            try {
                const response = await fetch('/api/llm-command', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                addMessage('Assistant', data.response);

                // Check if the response contains thermodynamic data
                if (data.thermo_data && Array.isArray(data.thermo_data)) {
                    drawPlot(data.thermo_data);
                } else {
                    updateStatus('Ready to run simulations');
                }

            } catch (error) {
                console.error('Error sending message:', error);
                addMessage('Error', 'Could not connect to the server.');
                updateStatus('Error occurred');
            }
        }
    </script>
</body>
</html>

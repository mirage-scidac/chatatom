<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatMD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .typing-dots {
            display: inline-block;
        }
        .typing-dots::after {
            content: '...';
            animation: typing 1.5s infinite;
        }
        @keyframes typing {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden">
    <div class="container mx-auto p-4 h-full grid grid-rows-[auto_1fr_auto] gap-4">
        <h1 class="text-3xl font-bold">ChatMD</h1>
        
        <!-- Main content area with chat and visualization panels -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 min-h-0">
            <!-- Chat panel -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-lg grid grid-rows-[auto_1fr_auto] gap-2 min-h-0">
                <h2 class="text-xl font-semibold">Chat</h2>
                <div id="chat-container" class="overflow-y-auto bg-gray-700 p-2 rounded min-h-0">
                    <!-- Chat messages will appear here -->
                </div>
                <div class="flex">
                    <input type="text" id="user-input" class="flex-grow bg-gray-600 text-white rounded-l-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your command...">
                    <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r-lg">Send</button>
                </div>
            </div>
            
            <!-- Thermodynamic plot panel -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-lg grid grid-rows-[auto_1fr] gap-2 min-h-0">
                <h2 class="text-xl font-semibold">Thermodynamic Data</h2>
                <div id="plot-container" class="bg-gray-700 p-2 rounded flex items-center justify-center min-h-0">
                    <canvas id="thermo-chart" class="hidden"></canvas>
                    <div id="plot-placeholder" class="text-gray-400">
                        Run a simulation to see thermodynamic data
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Status and information panel -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-2">Simulation Status</h2>
            <div id="status-container" class="text-gray-300">
                Ready to run simulations
            </div>
        </div>
    </div>

    <script>
        let thermoChart = null;

        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function addMessage(sender, message) {
            const chatContainer = document.getElementById('chat-container');
            const messageElement = document.createElement('div');
            messageElement.classList.add('mb-3', 'p-2', 'rounded');
            
            // Check if this is a user message
            if (sender === 'You') {
                messageElement.classList.add('bg-purple-800', 'border-l-4', 'border-purple-400');
                messageElement.innerHTML = `
                    <div class="flex items-start">
                        <span class="mr-2 text-lg">👤</span>
                        <div class="flex-1">
                            <strong class="text-white">${sender}:</strong>
                            <div class="mt-1 text-gray-100">${message.replace(/\n/g, '<br>')}</div>
                        </div>
                    </div>
                `;
            } else {
                // Keep original styling for non-user messages
                messageElement.classList.add('mb-2');
                messageElement.innerHTML = `<p><strong>${sender}:</strong> ${message}</p>`;
            }
            
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addConversationMessage(agent, content, type) {
            const chatContainer = document.getElementById('chat-container');
            const messageElement = document.createElement('div');
            messageElement.classList.add('mb-3', 'p-2', 'rounded');
            
            // Color coding for different agents
            let colorClass = '';
            let agentIcon = '';
            
            switch(agent) {
                case 'Orchestrator':
                    colorClass = 'bg-blue-800 border-l-4 border-blue-400';
                    agentIcon = '🎯';
                    break;
                case 'Generator':
                    colorClass = 'bg-green-800 border-l-4 border-green-400';
                    agentIcon = '⚙️';
                    break;
                case 'Reviewer':
                    colorClass = 'bg-yellow-800 border-l-4 border-yellow-400';
                    agentIcon = '🔍';
                    break;
                case 'System':
                    if (type === 'error') {
                        colorClass = 'bg-red-800 border-l-4 border-red-400';
                        agentIcon = '❌';
                    } else if (type === 'success') {
                        colorClass = 'bg-green-800 border-l-4 border-green-400';
                        agentIcon = '✅';
                    } else {
                        colorClass = 'bg-gray-700 border-l-4 border-gray-400';
                        agentIcon = 'ℹ️';
                    }
                    break;
                default:
                    colorClass = 'bg-gray-700';
                    agentIcon = '💬';
            }
            
            messageElement.classList.add(...colorClass.split(' '));
            
            // Format content based on type
            let formattedContent = content;
            if (type === 'script') {
                formattedContent = `<pre class="bg-gray-900 p-2 rounded mt-2 overflow-x-auto"><code>${content}</code></pre>`;
            } else {
                formattedContent = content.replace(/\n/g, '<br>');
            }
            
            messageElement.innerHTML = `
                <div class="flex items-start">
                    <span class="mr-2 text-lg">${agentIcon}</span>
                    <div class="flex-1">
                        <strong class="text-white">${agent}:</strong>
                        <div class="mt-1 text-gray-100">${formattedContent}</div>
                    </div>
                </div>
            `;
            
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateStatus(message) {
            const statusContainer = document.getElementById('status-container');
            statusContainer.textContent = message;
        }

        function drawPlot(thermoData) {
            if (!thermoData || thermoData.length === 0) {
                console.log('No thermodynamic data to plot');
                return;
            }

            console.log(`Received ${thermoData.length} data points:`, thermoData);

            // Show the chart canvas and hide placeholder
            const chartCanvas = document.getElementById('thermo-chart');
            const placeholder = document.getElementById('plot-placeholder');
            chartCanvas.classList.remove('hidden');
            placeholder.style.display = 'none';

            // Destroy existing chart if it exists
            if (thermoChart) {
                thermoChart.destroy();
            }

            // Prepare data for plotting - process ALL data points
            const steps = [];
            const temperatures = [];
            const energies = [];
            const pressures = [];

            // Process each data point in the array
            thermoData.forEach(dataPoint => {
                steps.push(dataPoint.step || 0);
                temperatures.push(dataPoint.temp || 0);
                energies.push(dataPoint.etotal || dataPoint.toteng || 0);
                pressures.push(dataPoint.press || 0);
            });

            console.log(`Plotting ${steps.length} steps:`, steps);
            console.log(`Temperature range:`, Math.min(...temperatures), 'to', Math.max(...temperatures));

            // Create the chart
            const ctx = chartCanvas.getContext('2d');
            thermoChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: steps,
                    datasets: [
                        {
                            label: 'Temperature (K)',
                            data: temperatures,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            yAxisID: 'y',
                            tension: 0.1
                        },
                        {
                            label: 'Total Energy',
                            data: energies,
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            yAxisID: 'y1',
                            tension: 0.1
                        },
                        {
                            label: 'Pressure',
                            data: pressures,
                            borderColor: 'rgb(255, 205, 86)',
                            backgroundColor: 'rgba(255, 205, 86, 0.1)',
                            yAxisID: 'y2',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Thermodynamic Properties vs Time Step',
                            color: 'white'
                        },
                        legend: {
                            labels: {
                                color: 'white'
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            title: {
                                display: true,
                                text: 'Time Step',
                                color: 'white'
                            },
                            ticks: {
                                color: 'white'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Temperature (K)',
                                color: 'rgb(255, 99, 132)'
                            },
                            ticks: {
                                color: 'rgb(255, 99, 132)'
                            },
                            grid: {
                                color: 'rgba(255, 99, 132, 0.1)'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Total Energy',
                                color: 'rgb(54, 162, 235)'
                            },
                            ticks: {
                                color: 'rgb(54, 162, 235)'
                            },
                            grid: {
                                drawOnChartArea: false,
                                color: 'rgba(54, 162, 235, 0.1)'
                            }
                        },
                        y2: {
                            type: 'linear',
                            display: false,
                            position: 'right'
                        }
                    }
                }
            });

            updateStatus(`Plotted ${thermoData.length} data points`);
        }

        let currentAgentMessages = {};
        let isStreaming = false;
        let conversationContext = '';  // Store context for phase 2 conversations
        let executionIntent = false;  // Track if original request implied execution
        let messageCounter = 0;  // Counter to ensure unique message IDs

        function addTypingIndicator(agent) {
            const chatContainer = document.getElementById('chat-container');
            const typingElement = document.createElement('div');
            typingElement.classList.add('mb-3', 'p-2', 'rounded');
            typingElement.id = `typing-${agent}`;
            
            let colorClass = '';
            let agentIcon = '';
            
            switch(agent) {
                case 'Orchestrator':
                    colorClass = 'bg-blue-800 border-l-4 border-blue-400';
                    agentIcon = '🎯';
                    break;
                case 'Generator':
                    colorClass = 'bg-green-800 border-l-4 border-green-400';
                    agentIcon = '⚙️';
                    break;
                case 'Reviewer':
                    colorClass = 'bg-yellow-800 border-l-4 border-yellow-400';
                    agentIcon = '🔍';
                    break;
                case 'System':
                    colorClass = 'bg-gray-700 border-l-4 border-gray-400';
                    agentIcon = 'ℹ️';
                    break;
            }
            
            typingElement.classList.add(...colorClass.split(' '));
            typingElement.innerHTML = `
                <div class="flex items-start">
                    <span class="mr-2 text-lg">${agentIcon}</span>
                    <div class="flex-1">
                        <strong class="text-white">${agent}:</strong>
                        <div class="mt-1 text-gray-100">
                            <span class="typing-dots">Thinking...</span>
                        </div>
                    </div>
                </div>
            `;
            
            chatContainer.appendChild(typingElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator(agent) {
            const typingElement = document.getElementById(`typing-${agent}`);
            if (typingElement) {
                typingElement.remove();
            }
        }

        function addStreamingMessage(agent, content, messageType) {
            // Ensure content is defined and not null
            if (content === undefined || content === null) {
                content = '';
            }
            
            // Use agent name as key for current streaming session
            const sessionKey = `${agent}-${messageType || 'default'}`;
            
            // Check if we already have a message for this agent in this session
            let messageElement = document.getElementById(`current-${sessionKey}`);
            
            if (!messageElement) {
                // Create new message element
                messageCounter++;
                const messageId = `current-${sessionKey}`;
                
                const chatContainer = document.getElementById('chat-container');
                messageElement = document.createElement('div');
                messageElement.classList.add('mb-3', 'p-2', 'rounded');
                messageElement.id = messageId;
                
                let colorClass = '';
                let agentIcon = '';
                
                switch(agent) {
                    case 'Orchestrator':
                        colorClass = 'bg-blue-800 border-l-4 border-blue-400';
                        agentIcon = '🎯';
                        break;
                    case 'Generator':
                        colorClass = 'bg-green-800 border-l-4 border-green-400';
                        agentIcon = '⚙️';
                        break;
                    case 'Reviewer':
                        colorClass = 'bg-yellow-800 border-l-4 border-yellow-400';
                        agentIcon = '🔍';
                        break;
                    case 'System':
                        if (messageType === 'error') {
                            colorClass = 'bg-red-800 border-l-4 border-red-400';
                            agentIcon = '❌';
                        } else if (messageType === 'success') {
                            colorClass = 'bg-green-800 border-l-4 border-green-400';
                            agentIcon = '✅';
                        } else {
                            colorClass = 'bg-gray-700 border-l-4 border-gray-400';
                            agentIcon = 'ℹ️';
                        }
                        break;
                    default:
                        colorClass = 'bg-gray-700';
                        agentIcon = '💬';
                }
                
                messageElement.classList.add(...colorClass.split(' '));
                messageElement.innerHTML = `
                    <div class="flex items-start">
                        <span class="mr-2 text-lg">${agentIcon}</span>
                        <div class="flex-1">
                            <strong class="text-white">${agent}:</strong>
                            <div class="mt-1 text-gray-100" id="content-${messageId}"></div>
                        </div>
                    </div>
                `;
                
                chatContainer.appendChild(messageElement);
                
                // Initialize the content accumulator
                if (!currentAgentMessages[sessionKey]) {
                    currentAgentMessages[sessionKey] = '';
                }
            }
            
            // Append content to existing message
            currentAgentMessages[sessionKey] += content;
            const contentElement = document.getElementById(`content-current-${sessionKey}`);
            
            if (contentElement) {
                // Format content based on type
                let formattedContent = currentAgentMessages[sessionKey];
                if (messageType === 'script') {
                    formattedContent = `<pre class="bg-gray-900 p-2 rounded mt-2 overflow-x-auto"><code>${currentAgentMessages[sessionKey]}</code></pre>`;
                } else {
                    formattedContent = currentAgentMessages[sessionKey].replace(/\n/g, '<br>');
                }
                
                contentElement.innerHTML = formattedContent;
            }
            
            // Auto-scroll
            const chatContainer = document.getElementById('chat-container');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const userInput = document.getElementById('user-input');
            const message = userInput.value.trim();

            if (message === '' || isStreaming) return;

            addMessage('You', message);
            userInput.value = '';
            updateStatus('Processing request...');
            isStreaming = true;
            currentAgentMessages = {};

            try {
                // Detect execution intent from the original request if this is a new conversation
                if (!conversationContext) {
                    const messageLower = message.toLowerCase();
                    executionIntent = ['simulate', 'run', 'execute', 'perform', 'start simulation', 'do simulation'].some(keyword => 
                        messageLower.includes(keyword)
                    );
                }
                
                // Build URL parameters
                const params = new URLSearchParams({
                    command: message
                });
                
                // Add conversation context if we're in phase 2
                if (conversationContext) {
                    params.append('context', conversationContext);
                    // Pass execution intent to backend
                    params.append('execution_intent', executionIntent.toString());
                    // Clear context after use
                    conversationContext = '';
                }
                
                // Use EventSource for streaming
                const eventSource = new EventSource('/api/llm-stream?' + params);

                eventSource.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        
                        switch(data.type) {
                            case 'status':
                                updateStatus(data.message);
                                break;
                                
                            case 'agent_start':
                                removeTypingIndicator(data.agent);
                                addTypingIndicator(data.agent);
                                break;
                                
                            case 'agent_content':
                                removeTypingIndicator(data.agent);
                                addStreamingMessage(data.agent, data.content, data.message_type);
                                break;
                                
                            case 'agent_complete':
                                removeTypingIndicator(data.agent);
                                break;
                                
                            case 'simulation_complete':
                                updateStatus('Simulation completed successfully');
                                if (data.thermo_data && Array.isArray(data.thermo_data)) {
                                    drawPlot(data.thermo_data);
                                }
                                break;
                                
                            case 'simulation_failed':
                                updateStatus('Simulation failed');
                                break;
                                
                            case 'script_ready':
                                updateStatus('Script ready - add "run" to execute');
                                break;
                                
                            case 'needs_more_info':
                                updateStatus('Waiting for additional information');
                                isStreaming = false;
                                eventSource.close();
                                break;
                                
                            case 'awaiting_confirmation':
                                updateStatus('Awaiting parameter confirmation');
                                // Store the analysis for phase 2
                                conversationContext = data.analysis;
                                isStreaming = false;
                                eventSource.close();
                                break;
                                
                            case 'review_failed':
                                updateStatus('Script review failed');
                                break;
                                
                            case 'workflow_complete':
                                updateStatus('Ready to run simulations');
                                isStreaming = false;
                                eventSource.close();
                                break;
                                
                            case 'error':
                                addMessage('Error', data.message);
                                updateStatus('Error occurred');
                                isStreaming = false;
                                eventSource.close();
                                break;
                        }
                    } catch (e) {
                        console.error('Error parsing SSE data:', e);
                    }
                };

                eventSource.onerror = function(event) {
                    console.error('EventSource failed:', event);
                    addMessage('Error', 'Connection to server lost. Please try again.');
                    updateStatus('Error occurred');
                    isStreaming = false;
                    eventSource.close();
                };

            } catch (error) {
                console.error('Error sending message:', error);
                addMessage('Error', 'Could not connect to the server.');
                updateStatus('Error occurred');
                isStreaming = false;
            }
        }
    </script>
</body>
</html>

[workspace]
name = "chatmd"
version = "0.1.0"
description = "ChatMD application environment"
authors = ["OpenAI Codex"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.12"
flask = ">=3.1,<3.2"
lammps = ">=2024.8,<2025"
numpy = ">=2.4,<2.5"
pip = ">=24,<26"
requests = ">=2.33,<2.34"

[pypi-dependencies]
dspy = ">=3.1,<3.2"
flask-socketio = ">=5.6,<6"
openai = ">=2.30,<3"
ovito = ">=3.15,<3.16"

[tasks]
run-app = "python src/app.py"

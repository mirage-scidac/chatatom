# .github/workflows/sync.yml
name: Sync Fork

on:
  # Run the workflow every 90 minutes
  schedule:
    - cron: '*/360 * * * *'
  # Allow running the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork
        uses: tgymnich/fork-sync@v1.9
        with:
          # REQUIRED: The original repository in 'owner/repo' format
          owner: mcherukara
          
          # REQUIRED: The personal access token you created
          token: ${{ secrets.SYNC_TOKEN }}

          # Optional: Specify the branch to sync from the upstream repo
          head: main

          # Optional: Specify the branch in your fork to update
          base: main
